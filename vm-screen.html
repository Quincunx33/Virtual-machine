    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
            background-color: #000000;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            width: 100dvw;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
            touch-action: none;
        }
        .spinner {
            border: 4px solid #FFE2E2;
            border-top: 4px solid #FFB8B8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #virtual-keyboard { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        .key { transition: background-color 0.1s ease, transform 0.1s ease; }
        .key.pressed { background-color: #FFB8B8; color: #231113; transform: scale(0.98); }

        #screen_container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            background: #000000;
            overflow: hidden;
        }
        
        #screen_container > canvas,
        #screen_container > div {
            flex-shrink: 0;
            transform-origin: center center;
            box-shadow: 0 0 24px rgba(255, 184, 184, 0.15);
        }
        
        /* Assistive Touch Floating Ball & Action Pad */
        #assistive-touch { 
            position: fixed;
            z-index: 50;
            cursor: grab; 
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: left 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), top 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        #assistive-touch.dragging {
            cursor: grabbing;
            transition: none !important;
        }
        #main-assistive-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid #FFB8B8;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 0 2px rgba(255, 184, 184, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #231113;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2), background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        #main-assistive-btn:hover {
            border-color: #FFA3A3;
            background: #FFF5F5;
            transform: scale(1.05);
        }
        #main-assistive-btn:active {
            transform: scale(0.92);
        }
        #assistive-touch.active #main-assistive-btn {
            background: #FFB8B8;
            border-color: #FFFFFF;
            color: #231113;
            box-shadow: 0 0 20px rgba(255, 184, 184, 0.55), 0 8px 24px rgba(0,0,0,0.45);
        }

        #assistive-panel {
            position: fixed;
            z-index: 50;
            transform-origin: bottom right;
        }
        #assistive-panel.hidden {
            display: none;
        }
        #assistive-panel:not(.hidden) {
            display: block;
            animation: panelPopIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
            will-change: transform, opacity;
        }
        @keyframes panelPopIn {
            from { opacity: 0; transform: scale(0.92) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        #assistive-backdrop:not(.hidden) {
            animation: backdropFadeIn 0.18s ease-out both;
        }
        @keyframes backdropFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #virtual-keyboard:not(.hidden) {
            animation: keyboardSlideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
            will-change: transform, opacity;
        }
        @keyframes keyboardSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Live Status Badge */
        #vm-status-badge {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 40;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            border: 1px solid #FFB8B8;
            border-radius: 20px;
            font-size: 10px;
            color: #231113;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .status-led { width: 6px; height: 6px; border-radius: 50%; background: #A38285; }
        .status-led.running { background: #16A34A; box-shadow: 0 0 6px rgba(22, 163, 74, 0.6); }
        .status-led.halted { background: #DC2626; }

        /* Non-blocking Screen Toast */
        #toast-container {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 110;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: 320px;
        }
        .vm-toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 25px rgba(35, 17, 19, 0.25);
            pointer-events: auto;
            animation: toastIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            transition: opacity 0.2s, transform 0.2s;
        }
        .vm-toast-success { background: rgba(255, 255, 255, 0.96); border: 1px solid #A7F3D0; color: #065F46; }
        .vm-toast-error { background: rgba(255, 255, 255, 0.96); border: 1px solid #FECACA; color: #991B1B; }
        .vm-toast-warning { background: rgba(255, 255, 255, 0.96); border: 1px solid #FDE68A; color: #92400E; }
        .vm-toast-info { background: rgba(255, 255, 255, 0.96); border: 1px solid #FFB8B8; color: #231113; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            #assistive-panel:not(.hidden), #assistive-backdrop:not(.hidden), #virtual-keyboard:not(.hidden), .vm-toast {
                animation: none !important;
            }
            #assistive-touch, #main-assistive-btn, .key {
                transition: none !important;
            }
        }
    </style>
</head>
