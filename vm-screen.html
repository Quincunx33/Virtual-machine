<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Web VM Screen</title>
    <!-- Stricter CSP: scripts only from self and trusted CDNs -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' wss: https://* blob:; img-src 'self' data: https:; media-src 'self' blob:;">
    
    <!-- App Icon & Manifest -->
    <link rel="icon" href="src/assets/images/pwa_app_icon_1787090612548.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="src/assets/images/pwa_app_icon_1787090612548.jpg">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            width: 100dvw;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
            touch-action: none; /* Prevent browser zooming/panning */
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #virtual-keyboard { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        .key { transition: background-color 0.1s ease; }
        .key.pressed { background-color: #4f46e5; transform: scale(0.98); }

        /* 
           FIX: Use Flexbox for robust centering. 
           This ensures the VM screen is always in the middle, regardless of aspect ratio.
        */
        #screen_container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            background: #000;
            overflow: hidden;
        }
        
        /* 
           Target the canvas and text div injected by libv86.
           We prevent them from shrinking so JS can scale them down accurately.
        */
        #screen_container > canvas,
        #screen_container > div {
            flex-shrink: 0;
            transform-origin: center center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); /* Nice glow for the screen */
        }
        
        /* Assistive Touch Floating Ball & Action Pad */
        #assistive-touch { 
            position: fixed;
            z-index: 50;
            cursor: grab; 
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: left 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), top 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        #assistive-touch.dragging {
            cursor: grabbing;
            transition: none !important;
        }
        #main-assistive-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(18, 22, 34, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 24px rgba(0,0,0,0.65), 0 2px 6px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2), background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        #main-assistive-btn:hover {
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 28px rgba(0,0,0,0.75), 0 0 14px rgba(255,255,255,0.25);
            transform: scale(1.05);
        }
        #main-assistive-btn:active {
            transform: scale(0.92);
        }
        #assistive-touch.active #main-assistive-btn {
            background: rgba(30, 41, 59, 0.95);
            border-color: rgba(99, 102, 241, 0.8);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5), 0 8px 24px rgba(0,0,0,0.7);
        }

        #assistive-panel {
            position: fixed;
            z-index: 50;
            transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        #assistive-panel.hidden {
            display: none;
            opacity: 0;
            transform: scale(0.92);
        }
        #assistive-panel:not(.hidden) {
            display: block;
            opacity: 1;
            transform: scale(1);
        }
        
        /* Live Status Badge */
        #vm-status-badge {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 40;
            padding: 4px 10px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 10px;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: monospace;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .status-led { width: 6px; height: 6px; border-radius: 50%; background: #444; }
        .status-led.running { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-led.halted { background: #ef4444; }

        /* Non-blocking Screen Toast */
        #toast-container {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 110;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: 320px;
        }
        .vm-toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            pointer-events: auto;
            animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transition: opacity 0.25s, transform 0.25s;
        }
        .vm-toast-success { background: rgba(6, 78, 59, 0.9); border: 1px solid rgba(16, 185, 129, 0.4); color: #d1fae5; }
        .vm-toast-error { background: rgba(127, 29, 29, 0.9); border: 1px solid rgba(239, 68, 68, 0.4); color: #fee2e2; }
        .vm-toast-warning { background: rgba(120, 53, 15, 0.9); border: 1px solid rgba(245, 158, 11, 0.4); color: #fef3c7; }
        .vm-toast-info { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(99, 102, 241, 0.4); color: #e0e7ff; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-300 flex items-center justify-center h-screen antialiased">

    <div id="toast-container"></div>

                    <i class="fas fa-download text-lg"></i>

                <button id="vm-power-btn" class="h-12 w-12 rounded-xl bg-slate-800/90 hover:bg-red-600 active:scale-95 flex items-center justify-center text-red-400 hover:text-white transition-all shadow-sm border border-slate-700/50" title="Shutdown">
